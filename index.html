<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LifeLink – Because Every Life Matters</title>

  <style>
    /* =========================================================
       1. THEME VARIABLES & BASE
       ========================================================= */
    :root {
      --red: #D7192D;
      --crim: #A8071A;
      --bur: #650816;
      --bg: #F8F9FB;
      --blush: #FFF0F1;
      --navy: #14243D;
      --mut: #65738A;
      --bd: #E5EAF0;
      --card: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

   

    :root[data-theme="dark"] {
      --bg: #0F1623; --card: #172033; --navy: #EEF2F8;
      --mut: #9AA8BF; --bd: #2A3650; --blush: #2B1520;
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body {
      margin: 0;
      font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--navy);
    }

    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px solid #f59aa4; outline-offset: 2px; }

    /* =========================================================
       2. HEADER & NAVIGATION
       ========================================================= */
    .top {
      display: flex; align-items: center; gap: 22px;
      padding: 14px 5vw;
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    }

    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 21px; }
    .links { display: flex; gap: 22px; margin: 0 auto; font-size: 13px; font-weight: 600; }
    .links a { padding: 10px 0; color: var(--navy); }
    .links a.on { color: var(--red); }

    .burger {
      display: none; background: none; border: 0;
      font-size: 26px; color: var(--navy);
      min-height: 44px; min-width: 44px; margin-left: auto;
    }

    .note { background: var(--bur); color: #fff; font-size: 12px; text-align: center; padding: 7px 12px; }

    /* =========================================================
       3. BUTTONS
       ========================================================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--red); color: #fff;
      border: 1.5px solid var(--red); border-radius: 10px;
      padding: 11px 20px;
      font: inherit; font-weight: 700;
      cursor: pointer; min-height: 44px;
    }
    .btn:hover { background: var(--crim); }
    .btn.o { background: transparent; color: var(--red); }
    .btn.o:hover { background: var(--blush); }
    .btn.dk { background: var(--crim); border-color: var(--crim); }
    .btn.sm { min-height: 38px; padding: 8px 18px; }

    /* =========================================================
       4. HOME PAGE (hero, trust badges, sections, cards)
       ========================================================= */
    .hero {
      display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 20px;
      padding: 50px 5vw 30px;
      position: relative; overflow: hidden;
      background: radial-gradient(circle at 85% 20%, var(--blush), transparent 55%);
    }

    h1 { font-size: clamp(40px, 6.5vw, 72px); line-height: 1; margin: 0 0 20px; letter-spacing: -2px; }
